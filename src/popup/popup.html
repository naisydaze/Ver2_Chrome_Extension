<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V2 Reminder Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <p id="upgrade-notice" class="upgrade-notice" role="status" hidden></p>
  <div class="summary-row">
    <strong>Goal categories</strong>
    <span id="selected-category">Loading...</span>
  </div>
  <div class="summary-row">
    <strong>Reminder frequency</strong>
    <span id="selected-interval">Loading...</span>
  </div>
  <div class="summary-row">
    <strong>Active hours</strong>
    <span id="active-hours">Loading...</span>
  </div>

  <label for="dnd-duration">Deep work block</label>
  <select id="dnd-duration">
    <option value="30">30 minutes</option>
    <option value="60" selected>1 hour</option>
    <option value="120">2 hours</option>
    <option value="day">Rest of today</option>
  </select>
  <button id="dnd-btn" class="dnd-off">Start Deep Work</button>
  <p id="dnd-status" aria-live="polite"></p>

  <button id="saveSettings">Change Settings</button>
  <p class="ai-disclosure">Prompts may be generated by Cloudflare Workers AI using only your selected preset category and a random installation ID. Browsing history is never sent.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
